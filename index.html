<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SIRIAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo',-apple-system,sans-serif;background:#F4EDE0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;padding:40px 20px}
.logo{font-size:13px;font-weight:800;letter-spacing:0.3em;color:#8B7355;text-transform:uppercase;margin-bottom:40px}
.title{font-size:clamp(2.5rem,6vw,5rem);font-weight:900;color:#2C2318;letter-spacing:-0.04em;line-height:1;margin-bottom:16px}
.sub{font-size:14px;color:#BFB09A;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:60px}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid #D9CEBC;border-radius:16px;padding:24px 28px;text-decoration:none;color:#2C2318;min-width:180px;transition:all .2s;cursor:pointer}
.card:hover{background:#2C2318;color:#F4EDE0;border-color:#2C2318;transform:translateY(-3px)}
.card-label{font-size:10px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#BFB09A;margin-bottom:8px}
.card:hover .card-label{color:#8B7355}
.card-name{font-size:15px;font-weight:700;letter-spacing:-0.01em}
.footer{margin-top:60px;font-size:11px;color:#D9CEBC;letter-spacing:0.15em}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SIRIAI</div>
  <div class="title">Architecture<br/>for Insight</div>
  <div class="sub">인플루언서 마케팅 에이전시</div>
  <div class="cards">
    <a class="card" href="/plan.html">
      <div class="card-label">Presentation</div>
      <div class="card-name">운영 체계화 기획안</div>
    </a>
    <a class="card" href="/인스타예시.html">
      <div class="card-label">Demo</div>
      <div class="card-name">인스타그램 예시</div>
    </a>
    <a class="card" href="/siriai-app.html">
      <div class="card-label">App</div>
      <div class="card-name">캠페인 플랫폼</div>
    </a>
  </div>
  <div class="footer">© 2026 SIRIAI</div>
</div>
</body>
</html>
