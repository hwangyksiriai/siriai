<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>siriai.ai • Instagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#000;max-width:480px;margin:0 auto;min-height:100vh;position:relative}

/* 상단 헤더 */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #dbdbdb;position:sticky;top:0;background:#fff;z-index:100}
.top-bar-username{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.top-bar-icons{display:flex;gap:16px}
.top-bar-icons button{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center}

/* 프로필 영역 */
.profile-section{padding:16px 16px 8px}
.profile-top{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.avatar{width:86px;height:86px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:none}
.avatar-text{font-size:22px;font-weight:900;color:#fff;letter-spacing:-1px;font-family:'Arial Black',sans-serif}
.stats{display:flex;flex:1;justify-content:space-around}
.stat{text-align:center;cursor:pointer}
.stat-num{font-size:17px;font-weight:700;display:block}
.stat-label{font-size:12px;color:#000}
.profile-name{font-size:13px;font-weight:700;margin-bottom:2px}
.profile-bio{font-size:13px;line-height:1.4;color:#000;margin-bottom:2px}
.profile-link{font-size:13px;color:#00376b;font-weight:600;text-decoration:none}

/* 버튼들 */
.profile-actions{display:flex;gap:8px;margin-top:12px;margin-bottom:4px;padding:0 16px}
.btn-follow{flex:1;background:#0095f6;color:#fff;border:none;border-radius:8px;padding:7px;font-size:14px;font-weight:600;cursor:pointer}
.btn-follow:active{background:#0081d6}
.btn-msg{flex:1;background:#efefef;color:#000;border:none;border-radius:8px;padding:7px;font-size:14px;font-weight:600;cursor:pointer}
.btn-more{background:#efefef;color:#000;border:none;border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}

/* 탭 */
.tabs{display:flex;border-top:1px solid #dbdbdb;margin-top:4px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer;border-top:2px solid transparent;color:#8e8e8e}
.tab.active{border-top-color:#000;color:#000}
.tab svg{width:24px;height:24px}

/* 그리드 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid-item{aspect-ratio:1;background:#f0f0f0;position:relative;cursor:pointer;overflow:hidden}
.grid-item img{width:100%;height:100%;object-fit:cover;display:block}
.grid-item:hover .grid-overlay{opacity:1}
.grid-overlay{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;gap:20px;color:#fff;font-size:13px;font-weight:700}

/* 빈 상태 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;color:#000}
.empty-icon{width:62px;height:62px;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.empty-title{font-size:22px;font-weight:300}
.empty-sub{font-size:14px;color:#8e8e8e;text-align:center}

/* 업로드 버튼 */
.fab{position:fixed;bottom:80px;right:calc(50% - 220px);width:52px;height:52px;background:#0095f6;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,149,246,.4);z-index:50;transition:transform .15s}
.fab:active{transform:scale(.92)}
@media(max-width:480px){.fab{right:20px}}

/* 하단 네비 */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #dbdbdb;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;cursor:pointer;border:none;background:none}
.nav-item svg{width:26px;height:26px}
.nav-avatar-sm{width:26px;height:26px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.nav-avatar-sm span{font-size:8px;font-weight:900;color:#fff;font-family:'Arial Black',sans-serif}
.nav-avatar-sm img{width:100%;height:100%;object-fit:cover;display:none}

/* 모달 오버레이 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;padding:20px}
.modal.open{opacity:1;pointer-events:all}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:440px;overflow:hidden;transform:scale(.95);transition:transform .25s}
.modal.open .modal-box{transform:scale(1)}
.modal-header{padding:12px 16px;border-bottom:1px solid #dbdbdb;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#000;line-height:1}
.modal-body{padding:16px}

/* 업로드 UI */
.upload-area{border:2px dashed #dbdbdb;border-radius:10px;padding:40px 20px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:14px}
.upload-area:hover{border-color:#0095f6;background:#f0f8ff}
.upload-area input{display:none}
.upload-icon{font-size:40px;margin-bottom:8px}
.upload-text{font-size:14px;color:#8e8e8e}
.upload-preview{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:none;margin-bottom:14px}
.form-input{width:100%;border:1px solid #dbdbdb;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;outline:none;margin-bottom:10px}
.form-input:focus{border-color:#0095f6}
.btn-submit{width:100%;background:#0095f6;color:#fff;border:none;border-radius:8px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.btn-submit:disabled{background:#b2dffc;cursor:default}

/* 포스트 상세 모달 */
.post-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.post-modal.open{opacity:1;pointer-events:all}
.post-card{background:#fff;border-radius:0;width:100%;max-width:440px;overflow:hidden}
.post-card-header{padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #dbdbdb}
.post-card-avatar{width:34px;height:34px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.post-card-avatar span{font-size:9px;font-weight:900;color:#fff;font-family:'Arial Black',sans-serif}
.post-card-name{font-size:13px;font-weight:700}
.post-card-img{width:100%;aspect-ratio:1;object-fit:cover}
.post-card-actions{padding:10px 12px;display:flex;gap:14px}
.post-card-actions button{background:none;border:none;cursor:pointer;font-size:22px;padding:0}
.post-card-caption{padding:0 12px 10px;font-size:13px;line-height:1.4}
.post-card-caption strong{font-weight:700;margin-right:4px}
.post-card-time{padding:0 12px 12px;font-size:10px;color:#8e8e8e;text-transform:uppercase}
.post-card-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;z-index:10;line-height:1}

/* 스토리 영역 */
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #dbdbdb}
.stories::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0}
.story-ring{width:66px;height:66px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.story-ring-inner{width:100%;height:100%;border-radius:50%;border:2px solid #fff;background:#f0f0f0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.story-ring-inner img{width:100%;height:100%;object-fit:cover}
.story-add{background:linear-gradient(135deg,#f0f0f0,#e0e0e0)}
.story-name{font-size:11px;color:#000;text-align:center;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-add-icon{font-size:28px;color:#0095f6;line-height:1}

/* 알림 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:400;opacity:0;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 팔로우 이미 눌렸을때 */
.btn-follow.following{background:#efefef;color:#000}
</style>
</head>

<script>
// 데이터
let posts = JSON.parse(localStorage.getItem('siriai-posts') || '[]');
let selectedImg = null;
let isFollowing = false;
let currentTab = 'grid';

// 초기화
function init() {
  updatePostCount();
  renderPosts();
}

// 게시물 수 업데이트
function updatePostCount() {
  document.getElementById('post-count').textContent = posts.length;
}

// 게시물 렌더링
function renderPosts() {
  const grid = document.getElementById('post-grid');
  const empty = document.getElementById('empty-state');

  if (posts.length === 0) {
    empty.style.display = 'flex';
    grid.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';

  // 최신 순으로 역순 정렬
  [...posts].reverse().forEach((post, i) => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.innerHTML = `
      <img src="${post.img}" alt="" loading="lazy"/>
      <div class="grid-overlay">
        <span>🤍 ${post.likes || 0}</span>
        <span>💬 0</span>
      </div>
    `;
    item.onclick = () => openPostModal(posts.length - 1 - i);
    grid.appendChild(item);
  });
}

// 업로드 모달
function openUploadModal() {
  document.getElementById('upload-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeUploadModal(e) {
  if (e && e.target !== document.getElementById('upload-modal')) return;
  document.getElementById('upload-modal').classList.remove('open');
  document.body.style.overflow = '';
  // 초기화
  document.getElementById('upload-area').style.display = 'block';
  document.getElementById('upload-preview').style.display = 'none';
  document.getElementById('upload-preview').src = '';
  document.getElementById('caption-input').value = '';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('file-input').value = '';
  selectedImg = null;
}

// 파일 미리보기
function previewFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    selectedImg = ev.target.result;
    const preview = document.getElementById('upload-preview');
    preview.src = selectedImg;
    preview.style.display = 'block';
    document.getElementById('upload-area').style.display = 'none';
    document.getElementById('submit-btn').disabled = false;
  };
  reader.readAsDataURL(file);
}

// 드래그 앤 드롭
const uploadArea = document.getElementById('upload-area');
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#0095f6'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#dbdbdb'; });
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '#dbdbdb';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = ev => {
      selectedImg = ev.target.result;
      const preview = document.getElementById('upload-preview');
      preview.src = selectedImg;
      preview.style.display = 'block';
      document.getElementById('upload-area').style.display = 'none';
      document.getElementById('submit-btn').disabled = false;
    };
    reader.readAsDataURL(file);
  }
});

// 게시물 제출
function submitPost() {
  if (!selectedImg) return;
  const caption = document.getElementById('caption-input').value.trim();
  const post = {
    id: Date.now(),
    img: selectedImg,
    caption: caption,
    likes: 0,
    time: new Date().toISOString(),
  };
  posts.push(post);
  localStorage.setItem('siriai-posts', JSON.stringify(posts));
  closeUploadModal();
  updatePostCount();
  renderPosts();
  showToast('게시물이 공유되었습니다 ✓');
}

// 포스트 상세
let currentPostIdx = -1;

function openPostModal(idx) {
  currentPostIdx = idx;
  const post = posts[idx];
  document.getElementById('detail-img').src = post.img;
  document.getElementById('detail-caption').textContent = post.caption || '';
  const d = new Date(post.time);
  document.getElementById('detail-time').textContent = d.toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
  document.getElementById('post-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePostModal() {
  document.getElementById('post-modal').classList.remove('open');
  document.body.style.overflow = '';
  currentPostIdx = -1;
}

// 삭제 메뉴
function openPostMenu() {
  const m = document.getElementById('menu-modal');
  m.style.display = 'flex';
}

function closePostMenu() {
  document.getElementById('menu-modal').style.display = 'none';
}

function confirmDelete() {
  if (currentPostIdx < 0) return;
  closePostMenu();
  closePostModal();
  posts.splice(currentPostIdx, 1);
  localStorage.setItem('siriai-posts', JSON.stringify(posts));
  updatePostCount();
  renderPosts();
  showToast('게시물이 삭제되었습니다');
}

// 좋아요
function toggleLike(btn) {
  btn.textContent = btn.textContent === '🤍' ? '❤️' : '🤍';
}

// 팔로우
function toggleFollow() {
  isFollowing = !isFollowing;
  const btn = document.getElementById('follow-btn');
  btn.textContent = isFollowing ? '팔로잉' : '팔로우';
  btn.classList.toggle('following', isFollowing);
}

// 탭 전환
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-grid').classList.toggle('active', tab === 'grid');
  document.getElementById('tab-tag').classList.toggle('active', tab === 'tag');

  if (tab === 'tag') {
    document.getElementById('post-grid').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    document.getElementById('empty-state').querySelector('.empty-title').textContent = '사진에서 찾기';
  } else {
    renderPosts();
  }
}

// 토스트
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// 게시물 삭제 (더블클릭)
document.getElementById('post-grid').addEventListener('dblclick', e => {
  // 삭제 기능은 숨겨진 기능으로 운영
});

init();
</script>
</body>
